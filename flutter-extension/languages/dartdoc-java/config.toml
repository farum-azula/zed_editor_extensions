# Generated by `python3 tests/check_queries.py --update`: the code of examples in documentation
# comments (languages/dartdoc) whose fence names it. The `java` grammar with tests/doc_languages/java.scm, each
# capture suffixed `.dartdoc` (`keyword.dartdoc`, which a theme styles as `keyword` unless it
# has a style of its own), and nothing else: no outline, runnables or tasks, so that an
# example's declarations stay out of the outline and get no run button. Hidden, so that the
# language there stays Dart's.
name = "Dartdoc Java"
grammar = "java"
hidden = true
