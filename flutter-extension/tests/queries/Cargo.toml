[package]
name = "dart-queries-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tree-sitter = "0.25"
streaming-iterator = "0.1"
# The grammars of the languages of examples, as Zed (Cargo.toml of zed-industries/zed) and its Java
# extension (extension.toml of zed-extensions/java) pin them.
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-java = { git = "https://github.com/tree-sitter/tree-sitter-java", rev = "94703d5a6bed02b98e438d7cad1136c01a60ba2c" }

[build-dependencies]
cc = "1"
