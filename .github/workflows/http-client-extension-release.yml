name: http-client-extension-release

# Prebuilt runners for the HTTP Client extension, so that installing the extension is all a user
# has to do: it downloads the asset matching its own version from the release this publishes.
# Tag a release with the version in http-client-extension/extension.toml:
#
#     git tag http-client-extension-v0.2.2 && git push origin http-client-extension-v0.2.2

on:
  push:
    tags: [http-client-extension-v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. http-client-extension-v0.2.2
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Draft the release
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the tag and check it against the manifest
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#http-client-extension-v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' http-client-extension/extension.toml | head -1)
          test "$version" = "$manifest" || {
            echo "tag $TAG does not match extension.toml version $manifest" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "HTTP Client ${TAG#http-client-extension-v}" --generate-notes

  runner:
    name: ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: http-client-extension/cli
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload zed-http-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET: zed-http-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.gz
        working-directory: http-client-extension/cli
        run: |
          # The extension unpacks the archive straight into its own directory, so the binary
          # must sit at the root of it.
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" zed-http
          gh release upload "$TAG" "$ASSET" --clobber
