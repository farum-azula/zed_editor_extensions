name: flutter-extension

# Checks flutter-extension:
# - the snippets parse the way Zed parses them and expand to Dart without errors, with the imports
#   they list;
# - the extension's WebAssembly builds without warnings;
# - the Dart language's tree-sitter queries compile against the pinned grammar, which parses the
#   newest Dart syntax, and highlight a sample as expected;
# - the Dart tools (tool/) do what they should against a stand-in for Flutter, on every OS: the
#   proxy (hot reload on save, device lookup for a target), DevTools (served for the app, its pages
#   opened by the tasks, a selected widget opened in Zed), the language server (snippets and the
#   imports they add, the copy of the tasks' programs), and the runner of the run tasks; the
#   tasks, the debug locator and the targets agree;
# - a real app, run through the proxy and Flutter's own debug adapter on each target, hot reloads
#   on save, hot restarts on Restart, gets DevTools (a widget selected in its inspector opens in
#   Zed), and quits on Stop.

on:
  push:
    branches: [main]
    paths:
      - flutter-extension/**
      - .github/workflows/flutter-extension.yml
  pull_request:
    paths:
      - flutter-extension/**
      - .github/workflows/flutter-extension.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: flutter-extension

jobs:
  snippets:
    name: Snippets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the snippets
        run: python3 tests/check_snippets.py

  wasm:
    name: Extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flutter-extension
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2

  queries:
    name: Dart queries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flutter-extension/tests/queries
      - run: python3 tests/check_queries.py

  tools:
    name: Tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart analyze --fatal-infos tool
      - run: dart format --line-length 100 --output none --set-exit-if-changed tool
      - run: python tests/check_tasks.py
      - run: python tests/check_proxy.py
      - run: python tests/check_devtools.py
      - run: python tests/check_lsp.py
      - run: python tests/check_run.py

  hot-reload:
    name: Hot reload on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos }
          # No simulator runs on the runner: the proxy boots one.
          - { os: macos-15, target: ios-simulator }
          - { os: windows-2025, target: windows }
          - { os: ubuntu-24.04, target: linux }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install the Linux desktop toolchain
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Run on ${{ matrix.target }}
        if: matrix.target != 'linux'
        run: python tests/check_hot_reload.py --device ${{ matrix.target }}
      - name: Run on linux, with a virtual display
        if: matrix.target == 'linux'
        run: xvfb-run -a python tests/check_hot_reload.py --device linux

  android:
    name: Hot reload on android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runs before the test: the proxy picks the running device for the target.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: flutter-extension
          script: python tests/check_hot_reload.py --device android
