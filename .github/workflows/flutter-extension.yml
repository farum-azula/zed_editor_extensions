name: flutter-extension

# Every snippet of flutter-extension parses the way Zed parses snippets and, expanded, is Dart that
# `flutter analyze` finds no errors in (see flutter-extension/tests/check_snippets.py).

on:
  push:
    branches: [main]
    paths:
      - flutter-extension/**
      - .github/workflows/flutter-extension.yml
  pull_request:
    paths:
      - flutter-extension/**
      - .github/workflows/flutter-extension.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snippets:
    name: Snippets
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter-extension
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the snippets
        run: python3 tests/check_snippets.py
